# Structural-motif and risk-community detectors (amlgm scan --config configs/patterns.yaml,
# benchmarks/run_ibm.py --config configs/patterns.yaml).
#
# Tuned on the VALIDATION slices only (temporal 60/20/20 split, middle 20 %) of IBM AML HI-Small
# and LI-Small; the test slices were never read. Coordinate ascent over per-detector grids
# (578 settings) maximising the mean validation PR-AUC of the full scanner, scored as in the
# benchmark: per-detector precision calibrated on validation, transaction score = max alert score,
# each slice scanned with the 4 days before it as unlabelled context (lookback).
# Scanner-wide settings: amounts converted to US dollars with rates inferred from the data
# (currency), motifs searched in ACH transfers only (transaction_types) -- every laundering
# attempt annotated in the training slice is ACH; the same tuning over all payment formats is
# reported in docs/limitations.md. This restriction is a property of the IBM simulator.
# Validation PR-AUC:  HI-Small 0.0681 (defaults, ACH) -> 0.2584
#                     LI-Small 0.0139 (defaults, ACH) -> 0.0927
# (previous configuration, no currency conversion / context / ACH: HI 0.0528, LI 0.0018)
fan_in:
  enabled: true
  min_counterparties: 3
  window: 120h
  min_total_amount: 0.0
  min_burst_ratio: 0.0
fan_out:
  enabled: true
  min_counterparties: 5
  window: 120h
  min_total_amount: 0.0
  min_burst_ratio: 3.0
smurfing:
  enabled: false
  structuring: true
  split: true
  threshold: 10000.0
  band: 0.25
  currency: US Dollar
  min_transactions: 5
  window: 24h
  min_band_share: 0.5
  min_parts: 4
  split_window: 24h
  split_tolerance: 0.15
  max_part_fraction: 0.5
cycle:
  enabled: true
  min_length: 3
  max_length: 12
  max_span: 4d
  min_hop_ratio: 0.5
  max_hop_ratio: 1.5
  cross_currency: false
  max_cycles: 100000
  max_branching: 100
  max_expansions: 3000000
scatter_gather:
  enabled: true
  min_intermediaries: 3
  hop_window: 72h
  max_span: 5d
  min_hop_ratio: 0.8
  max_hop_ratio: 100.0
  max_hub_degree: 30
gather_scatter:
  enabled: true
  min_in: 2
  min_out: 2
  gather_window: 72h
  scatter_window: 24h
  min_conservation: 0.7
  max_conservation: 100.0
  min_burst_ratio: 3.0
  min_activity_share: 0.0
community:
  enabled: true
  min_size: 3
  max_size: 40
  min_flow_through: 0.6
  max_member_degree: 40
  min_relays: 1
  min_internal_tx: 3
  min_internal_share: 0.4
  max_span: 7d
  resolution: 1.0
  seed: 0
currency:
  convert: true
  reference: US Dollar
  rates: null
lookback: 4d
transaction_types:
- ACH
