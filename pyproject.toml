[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-graphminer"
dynamic = ["version"]
description = "Open-source toolkit for explainable money-laundering detection on transaction graphs (structural motifs + Graph Neural Networks)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "AML-GraphMiner contributors" },  # TODO: real names / contact before publishing (RELEASE.md)
]
keywords = [
    "anti-money laundering",
    "graph neural networks",
    "financial crime",
    "explainable AI",
    "PyTorch Geometric",
    "Jupyter",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Core = everything that does NOT need PyTorch: ingestion, features, graphs,
# structural-motif detectors, tabular baselines, metrics, CLI.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "networkx>=3.2",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "click>=8.1",
    "joblib>=1.3",
]

[project.optional-dependencies]
gnn = ["torch>=2.2", "torch_geometric>=2.5", "lightning>=2.2"]
explain = ["captum>=0.7"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
parquet = ["pyarrow>=14"]
scale = ["polars>=0.20", "pyarrow>=14"]
xgboost = ["xgboost>=2.0"]
tracking = ["mlflow>=2.10"]
hub = ["huggingface_hub>=0.22"]
neo4j = ["neo4j>=5.14"]
data = ["kaggle>=1.6"]
viz = ["matplotlib>=3.8"]
jupyter = ["ipython>=8"]  # the magics of the Jupyter plugin (rich display needs nothing)
all = [
    "aml-graphminer[gnn,explain,api,parquet,scale,xgboost,tracking,hub,neo4j,data,viz,jupyter]",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "nbval>=0.11",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "pandas-stubs",
    "types-PyYAML",
    "build>=1.2",
    "twine>=5",
]
docs = [
    "sphinx>=7.2",
    "myst-parser>=2.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "ipython>=8",  # API reference of aml_graphminer.jupyter.magics
]

[project.scripts]
amlgm = "aml_graphminer.cli:run"

[project.urls]
Homepage = "https://github.com/Abeidak/aml-graphminer"
Documentation = "https://aml-graphminer.readthedocs.io"
Issues = "https://github.com/Abeidak/aml-graphminer/issues"

[tool.setuptools.dynamic]
version = { attr = "aml_graphminer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aml_graphminer = ["py.typed", "api/static/*"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# generated notebooks are built from notebooks/src; the legacy ones are the student's originals
extend-exclude = ["notebooks/*.ipynb", "notebooks/colab_legacy", "hub"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # line length handled by the formatter
    "B905",    # zip() without strict= (py3.10 compat not needed, but noisy)
    "RUF005",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "RUF012"]
# cells may import late, use typographic symbols and end with a bare expression (displayed)
"notebooks/src/*" = ["E402", "I001", "RUF001", "RUF003", "B018"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false  # ignores depend on which optional libraries are installed
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gnn: tests that need torch + torch_geometric (skipped when they are missing)",
    "slow: slower end-to-end tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["aml_graphminer"]
branch = false

[tool.coverage.report]
# Full installation (``pip install -e '.[all,dev]'``, GNN tests included): the CDC asks for
# >= 90 %. The torch-free core has its own 90 % gate in ``.coveragerc-core`` (see CONTRIBUTING.md).
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
