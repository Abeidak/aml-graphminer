# Structural-motif and risk-community detectors (amlgm scan --config configs/patterns.yaml,
# benchmarks/run_ibm.py --config configs/patterns.yaml).
#
# Everything below was chosen on the VALIDATION slices only (temporal 60/20/20 split, middle 20 %)
# of IBM AML HI-Small and LI-Small; the test slices were never read while choosing.
# - Detector settings: coordinate ascent over per-detector grids (866 settings) maximising the
#   mean validation PR-AUC of the full scanner, scored as in the benchmark (precision calibrated
#   on validation, transaction score = max alert score, 4 unlabelled days of context before each
#   scanned slice). Validation PR-AUC: HI-Small 0.2882, LI-Small 0.0930.
# - calibration_bins: 8 (precision per band of alert score), chosen by a 2-fold split of the
#   validation slice (calibrate on one half, measure on the other): HI-Small 0.177 (1 band) ->
#   0.281 (8 bands), LI-Small 0.048 -> 0.097; combine "max" (noisy-or measured equal).
# - gather_scatter.scatter_lead 12h (the hub may pay out before it is paid): same 2-fold check,
#   HI-Small 0.2809 -> 0.2818, LI-Small 0.0970 -> 0.1012.
# - relay (A -> B -> C, the account forwards 0.9-1.2x what it received within 96 h, in another
#   currency; the IBM "stack" motif): same 2-fold check over 50 variants, HI-Small 0.2818 ->
#   0.3868, LI-Small 0.1012 -> 0.1193.
# - Scanner-wide: amounts converted to US dollars (rates inferred from the data), ACH transfers
#   only, self-transfers / same-bank / cross-currency transactions excluded: the ACH restriction
#   and the cross-currency exclusion are properties of the IBM simulator (docs/limitations.md).
fan_in:
  enabled: true
  min_counterparties: 3
  window: 120h
  min_total_amount: 0.0
  min_burst_ratio: 0.0
  min_span: 24h
  min_mean_amount: 5000.0
fan_out:
  enabled: true
  min_counterparties: 4
  window: 120h
  min_total_amount: 0.0
  min_burst_ratio: 3.0
  min_span: null
  min_mean_amount: 5000.0
smurfing:
  enabled: false
  structuring: true
  split: true
  threshold: 10000.0
  band: 0.25
  currency: US Dollar
  min_transactions: 5
  window: 24h
  min_band_share: 0.5
  min_parts: 4
  split_window: 24h
  split_tolerance: 0.15
  max_part_fraction: 0.5
cycle:
  enabled: true
  min_length: 3
  max_length: 12
  max_span: 4d
  min_hop_ratio: 0.8
  max_hop_ratio: 1.2
  cross_currency: false
  max_cycles: 100000
  max_branching: 100
  max_expansions: 3000000
scatter_gather:
  enabled: true
  min_intermediaries: 2
  hop_window: 72h
  max_span: 5d
  min_hop_ratio: 0.8
  max_hop_ratio: 1.2
  max_hub_degree: 30
gather_scatter:
  enabled: true
  min_in: 2
  min_out: 2
  gather_window: 24h
  scatter_window: 24h
  min_conservation: 0.01
  max_conservation: 100.0
  min_burst_ratio: 3.0
  min_activity_share: 0.0
  scatter_lead: 12h
community:
  enabled: true
  min_size: 3
  max_size: 40
  min_flow_through: 0.9
  max_member_degree: 80
  min_relays: 1
  min_internal_tx: 3
  min_internal_share: 0.4
  max_span: 7d
  resolution: 1.0
  seed: 0
relay:
  enabled: true
  hop_window: 96h
  min_hop_ratio: 0.9
  max_hop_ratio: 1.2
  max_degree: 50
  currency_change: true
currency:
  convert: true
  reference: US Dollar
  rates: null
lookback: 4d
transaction_types:
- ACH
exclude:
- self_transfers
- same_bank
- cross_currency
combine: max
calibration_bins: 8
